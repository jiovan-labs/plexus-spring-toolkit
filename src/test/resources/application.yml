spring:
    autoconfigure:
        exclude:
            - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
            - org.springframework.boot.cache.autoconfigure.CacheAutoConfiguration
            - org.springframework.boot.autoconfigure.context.MessageSourceAutoConfiguration
            - org.springframework.boot.data.jdbc.autoconfigure.DataJdbcRepositoriesAutoConfiguration
            - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
            - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
            - org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration
            - org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration
            - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
            - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
            - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
            - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
            - org.springframework.boot.gson.autoconfigure.GsonAutoConfiguration
            - org.springframework.boot.http.converter.autoconfigure.HttpMessageConvertersAutoConfiguration
            - org.springframework.boot.jackson.autoconfigure.JacksonAutoConfiguration
            - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
            - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
            - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
            - org.springframework.boot.jsonb.autoconfigure.JsonbAutoConfiguration
            - org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
            - org.springframework.boot.mail.autoconfigure.MailSenderValidatorAutoConfiguration
            - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
            - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
            - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
            - org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
            - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
            - org.springframework.boot.autoconfigure.task.TaskExecutionAutoConfiguration
            - org.springframework.boot.thymeleaf.autoconfigure.ThymeleafAutoConfiguration
            - org.springframework.boot.transaction.autoconfigure.TransactionAutoConfiguration
            - org.springframework.boot.validation.autoconfigure.ValidationAutoConfiguration
            - org.springframework.boot.webclient.autoconfigure.WebClientAutoConfiguration
            - org.springframework.boot.servlet.autoconfigure.HttpEncodingAutoConfiguration
            - org.springframework.boot.webmvc.autoconfigure.WebMvcAutoConfiguration
            - org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration
            - org.springframework.boot.webservices.autoconfigure.client.WebServiceTemplateAutoConfiguration
            - org.springframework.boot.webservices.autoconfigure.WebServicesAutoConfiguration
    cache:
        type: redis
    data:
        redis:
            repositories:
                enabled: false
